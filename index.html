<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiccoInvoices</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.header {
    background: #111827;
    color: white;
    padding: 25px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.section {
    margin-bottom: 25px;
}

.section h2 {
    border-bottom: 2px solid #eee;
    padding-bottom: 10px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input, textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f3f4f6;
}

.item-input {
    width: 100%;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn {
    background: #2563eb;
    color: white;
    margin-top: 15px;
}

.remove-btn {
    background: #dc2626;
    color: white;
}

.summary {
    max-width: 350px;
    margin-left: auto;
    margin-top: 25px;
}

.summary div {
    display: flex;
    justify-content: space-between;
    padding: 8px;
}

.grand-total {
    font-size: 22px;
    font-weight: bold;
    border-top: 2px solid #222;
    margin-top: 8px;
    padding-top: 12px !important;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

.print-btn {
    background: #16a34a;
    color: white;
}

.clear-btn {
    background: #6b7280;
    color: white;
}

@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .container {
        margin: 10px;
        padding: 18px;
    }

    table {
        font-size: 13px;
    }

    .actions {
        flex-direction: column;
    }
}

@media print {
    body {
        background: white;
    }

    .header {
        background: white;
        color: black;
    }

    .container {
        box-shadow: none;
        margin: 0;
    }

    .no-print {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>MiccoInvoices</h1>
    <p>Simple. Professional. Easy invoicing.</p>
</div>

<div class="container">

    <div class="section">
        <h2>Your Business</h2>

        <div class="grid">

            <div>
                <label>Business Name</label>
                <input type="text" id="businessName" placeholder="Your business name">
            </div>

            <div>
                <label>Phone / Email</label>
                <input type="text" id="businessContact" placeholder="Phone or email">
            </div>

        </div>

        <br>

        <label>Business Address</label>
        <textarea id="businessAddress" placeholder="Business address"></textarea>

    </div>


    <div class="section">

        <h2>Invoice Details</h2>

        <div class="grid">

            <div>
                <label>Invoice Number</label>
                <input type="text" id="invoiceNumber" value="INV-001">
            </div>

            <div>
                <label>Invoice Date</label>
                <input type="date" id="invoiceDate">
            </div>

        </div>

        <br>

        <label>Due Date</label>
        <input type="date" id="dueDate">

    </div>


    <div class="section">

        <h2>Customer</h2>

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Customer name">

        <br><br>

        <label>Customer Address</label>
        <textarea id="customerAddress" placeholder="Customer address"></textarea>

    </div>


    <div class="section">

        <h2>Items / Services</h2>

        <table>

            <thead>
                <tr>
                    <th>Description</th>
                    <th>Quantity</th>
                    <th>Price (N$)</th>
                    <th>Total (N$)</th>
                    <th class="no-print">Action</th>
                </tr>
            </thead>

            <tbody id="items"></tbody>

        </table>

        <button class="add-btn no-print" onclick="addItem()">
            + Add Item
        </button>

    </div>


    <div class="summary">

        <div>
            <span>Subtotal</span>
            <span>N$ <span id="subtotal">0.00</span></span>
        </div>

        <div>
            <span>VAT (%)</span>
            <input
                type="number"
                id="vatRate"
                value="0"
                min="0"
                style="width:80px"
                oninput="calculateTotal()"
            >
        </div>

        <div>
            <span>VAT</span>
            <span>N$ <span id="vatAmount">0.00</span></span>
        </div>

        <div class="grand-total">
            <span>Total</span>
            <span>N$ <span id="grandTotal">0.00</span></span>
        </div>

    </div>


    <div class="actions no-print">

        <button class="print-btn" onclick="window.print()">
            Print / Save PDF
        </button>

        <button class="clear-btn" onclick="clearInvoice()">
            New Invoice
        </button>

    </div>

</div>


<script>

document.getElementById("invoiceDate").valueAsDate = new Date();

function addItem() {

    const row = document.createElement("tr");

    row.innerHTML = `

        <td>
            <input
                class="item-input"
                type="text"
                placeholder="Product or service"
            >
        </td>

        <td>
            <input
                class="quantity"
                type="number"
                value="1"
                min="1"
                oninput="calculateTotal()"
            >
        </td>

        <td>
            <input
                class="price"
                type="number"
                value="0"
                min="0"
                step="0.01"
                oninput="calculateTotal()"
            >
        </td>

        <td>
            N$ <span class="line-total">0.00</span>
        </td>

        <td class="no-print">
            <button
                class="remove-btn"
                onclick="this.closest('tr').remove(); calculateTotal();"
            >
                Remove
            </button>
        </td>

    `;

    document.getElementById("items").appendChild(row);

    calculateTotal();
}


function calculateTotal() {

    let subtotal = 0;

    const rows = document.querySelectorAll("#items tr");

    rows.forEach(row => {

        const quantity =
            parseFloat(row.querySelector(".quantity").value) || 0;

        const price =
            parseFloat(row.querySelector(".price").value) || 0;

        const total = quantity * price;

        row.querySelector(".line-total").textContent =
            total.toFixed(2);

        subtotal += total;

    });


    const vatRate =
        parseFloat(document.getElementById("vatRate").value) || 0;

    const vat =
        subtotal * vatRate / 100;

    const grandTotal =
        subtotal + vat;


    document.getElementById("subtotal").textContent =
        subtotal.toFixed(2);

    document.getElementById("vatAmount").textContent =
        vat.toFixed(2);

    document.getElementById("grandTotal").textContent =
        grandTotal.toFixed(2);
}


function clearInvoice() {

    if (confirm("Start a new invoice?")) {
        location.reload();
    }

}


addItem();

</script>

</body>
</html>
